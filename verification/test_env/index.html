<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Verification</title>
    <style>
        body {
            background-color: #222;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button id="trigger-toast">Test Save Toast</button>
    <button id="trigger-error">Test Error Toast</button>

    <script type="module">
        import { app } from "./scripts/app.js";
        // Import the node script
        import "./node/web/shader_params_save_button.js";

        // Expose app to window for debugging
        window.app = app;

        document.getElementById('trigger-toast').addEventListener('click', () => {
            // Check for showShaderToast (exposed name)
            if (window.showShaderToast) {
                window.showShaderToast("Parameters saved successfully!", "success");
            } else if (window.showToast) {
                // Fallback if I named it differently
                window.showToast("Parameters saved successfully!", "success");
            } else {
                console.error("showShaderToast not found on window");
            }
        });

        document.getElementById('trigger-error').addEventListener('click', () => {
            if (window.showShaderToast) {
                window.showShaderToast("Error saving parameters!", "error");
            } else if (window.showToast) {
                window.showToast("Error saving parameters!", "error");
            } else {
                console.error("showShaderToast not found on window");
            }
        });
    </script>
</body>
</html>
