# Pytest config lives here, not in pyproject.toml, on purpose: the pack's root
# directory has an __init__.py, so a rootdir above this one makes pytest import
# that file as a test package, which fails (its relative imports have no parent
# package). Keeping the config here makes this directory the rootdir.
#
# Run with ComfyUI's venv so `comfy` is importable:
#   ~/ComfyUI/venv/bin/python -m pytest custom_nodes/comfyui-shadernoiseksampler/tests
[pytest]
testpaths = .
addopts = --import-mode=importlib -p no:cacheprovider
